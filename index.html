<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js Marker 360 Showcase</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- ADDED: component that triggers the one-shot 360° spin every time the marker is (re)found -->
  <script>
    AFRAME.registerComponent('spin-on-marker', {
      init: function () {
        var marker = this.el;

        marker.addEventListener('markerFound', function () {
          var rotator = marker.querySelector('.rotator');
          if (!rotator) return;

          // Reset any previous spin animation and rotation before starting a new one
          rotator.removeAttribute('animation__spin');
          rotator.setAttribute('rotation', '0 0 0');

          // Force a reflow so the reset rotation is applied before the new animation starts
          requestAnimationFrame(function () {
            rotator.setAttribute('animation__spin', {
              property: 'rotation',
              from: '0 0 0',
              to: '0 360 0',
              dur: 2500,
              easing: 'easeInOutQuad',
              loop: false
            });
          });
        });

        marker.addEventListener('markerLost', function () {
          var rotator = marker.querySelector('.rotator');
          if (!rotator) return;

          // Stop mid-spin and reset so it's ready to spin cleanly on next detection
          rotator.removeAttribute('animation__spin');
          rotator.setAttribute('rotation', '0 0 0');
        });
      }
    });
  </script>

  <!-- ADJUST: keep your existing gesture-handler component definition here if it differs -->
  <script>
    AFRAME.registerComponent('gesture-handler', {
      schema: {
        enabled: { default: true },
        rotationFactor: { default: 5 },
        minScale: { default: 0.3 },
        maxScale: { default: 8 }
      },
      init: function () {
        this.handleScale = this.handleScale.bind(this);
        this.handleRotation = this.handleRotation.bind(this);
        this.isVisible = false;
        this.initialScale = this.el.object3D.scale.clone();
        this.scaleFactor = 1;
        this.el.sceneEl.addEventListener('markerFound', () => { this.isVisible = true; });
        this.el.sceneEl.addEventListener('markerLost', () => { this.isVisible = false; });
      },
      update: function () {
        if (this.data.enabled) {
          this.el.sceneEl.addEventListener('onefingermove', this.handleRotation);
          this.el.sceneEl.addEventListener('twofingermove', this.handleScale);
        } else {
          this.el.sceneEl.removeEventListener('onefingermove', this.handleRotation);
          this.el.sceneEl.removeEventListener('twofingermove', this.handleScale);
        }
      },
      handleRotation: function (event) {
        if (this.isVisible) {
          this.el.object3D.rotation.y += event.detail.positionChange.x * this.data.rotationFactor;
        }
      },
      handleScale: function (event) {
        if (this.isVisible) {
          this.scaleFactor *= 1 + event.detail.spreadChange / event.detail.startSpread;
          this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);
          this.el.object3D.scale.set(
            this.initialScale.x * this.scaleFactor,
            this.initialScale.y * this.scaleFactor,
            this.initialScale.z * this.scaleFactor
          );
        }
      }
    });
  </script>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <a-asset-item id="modelAsset" src="asset.gltf"></a-asset-item>
    </a-assets>

    <!-- ADDED: spin-on-marker component attached to the marker -->
    <a-marker type="pattern" url="marker.patt" spin-on-marker>

      <!-- ADDED: rotator wrapper — this is what actually spins 360°, marker itself never rotates -->
      <a-entity class="rotator" rotation="0 0 0">

        <!--
          ADJUST: rotation="0 180 0" below corrects the model's initial "front" so it faces
          the AR camera regardless of how the GLTF was exported. Change the Y value (0/90/180/270)
          to match your asset's actual forward axis.
        -->
        <a-entity
          gltf-model="#modelAsset"
          animation-mixer
          gesture-handler
          scale="1 1 1"
          position="0 0 0"
          rotation="0 180 0"
        ></a-entity>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
