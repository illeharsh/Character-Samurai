<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Samurai AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%; width: 100%; position: absolute; top: 0; left: 0;
      background-color: rgba(0, 0, 0, 0.8); z-index: 9999; display: flex;
      justify-content: center; align-items: center;
    }
    .arjs-loader div {
      text-align: center; font-size: 1.25em; color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <!-- Simple loader shown until scene.gltf is fully loaded -->
  <div class="arjs-loader">
    <div>Loading Samurai model...</div>
  </div>

  <!-- Component: plays a one-shot 360 deg Y-axis spin every time the marker is (re)found -->
  <script>
    AFRAME.registerComponent('spin-on-marker', {
      init: function () {
        var marker = this.el;

        marker.addEventListener('markerFound', function () {
          var rotator = marker.querySelector('.rotator');
          if (!rotator) return;

          // Reset before starting so every detection begins from front-facing orientation
          rotator.removeAttribute('animation__spin');
          rotator.setAttribute('rotation', '0 0 0');

          requestAnimationFrame(function () {
            rotator.setAttribute('animation__spin', {
              property: 'rotation',
              from: '0 0 0',
              to: '0 360 0',
              dur: 2500,
              easing: 'easeInOutQuad',
              loop: false
            });
          });
        });

        marker.addEventListener('markerLost', function () {
          var rotator = marker.querySelector('.rotator');
          if (!rotator) return;

          // Stop mid-spin and reset so next detection starts clean
          rotator.removeAttribute('animation__spin');
          rotator.setAttribute('rotation', '0 0 0');
        });
      }
    });
  </script>

  <!-- Component: hides the load screen once the gltf-model has finished loading -->
  <script>
    AFRAME.registerComponent('model-ready-watcher', {
      init: function () {
        this.el.addEventListener('model-loaded', function () {
          var loader = document.querySelector('.arjs-loader');
          if (loader) loader.style.display = 'none';
        });
        this.el.addEventListener('model-error', function (e) {
          console.error('Model failed to load:', e.detail);
          var loader = document.querySelector('.arjs-loader');
          if (loader) loader.innerHTML = '<div>Failed to load model</div>';
        });
      }
    });
  </script>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets timeout="30000">
      <!-- scene.bin and textures/material_0_baseColor.jpeg are referenced internally by scene.gltf
           via relative paths, so they load automatically as long as folder structure is preserved -->
      <a-asset-item id="samuraiModel" src="scene.gltf"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="marker.patt" spin-on-marker>

      <!-- Rotator wrapper: this spins 360 deg, marker itself never rotates -->
      <a-entity class="rotator" rotation="0 0 0">

        <!-- rotation="0 180 0" corrects front-facing orientation to face the AR camera -->
        <a-entity
          gltf-model="#samuraiModel"
          animation-mixer
          model-ready-watcher
          scale="0.05 0.05 0.05"
          position="0 0 0"
          rotation="0 180 0"
        ></a-entity>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
